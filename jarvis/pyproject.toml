[project]
name = "jarvis"
version = "0.1.0"
description = "Local, model-agnostic AI agent with tools, memory, and safety layer."
requires-python = ">=3.10"
authors = [{ name = "Jarvis" }]
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "chromadb>=0.5",
    "sentence-transformers>=2.7",
]

[project.scripts]
jarvis = "jarvis.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]
